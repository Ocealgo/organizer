<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The source every app icon is generated from.

    The Ocealgo wave, white on black rather than black on white.

    Inverted rather than reproduced, because of the size this is seen at: a
    thin dark wave on a white tile reads as an empty square at 48px, and a
    white tile disappears into a light home screen. White on black is the
    highest contrast either way round and holds its shape smallest.

    Android's maskable crop takes a circle out of the tile, so the mark sits
    well inside the middle 80% or it would lose its ends.

    The strokes are heavier than the original artwork on purpose. At 48px the
    logo's own weight thins out to a hairline and the mark stops reading as
    anything; this keeps its shape at the size it will actually be seen.

    Traced, not the original file — drop the real artwork in over this and
    re-run the generator to get it exactly.
  -->
  <rect width="512" height="512" fill="#000000"/>

  <!-- Two tapered crests, the lower offset right and down, as in the mark.
       Kept inside the middle 80% so a circular maskable crop keeps both tips. -->
  <g fill="#ffffff" transform="translate(66 168) scale(2.88)">
    <path d="M0,33
             C16,34 30,11 52,6
             C66,3 84,5 98,14
             C84,11 68,11 54,15
             C32,21 16,38 0,33 Z"/>
    <path transform="translate(34 24)"
          d="M0,33
             C16,34 30,11 52,6
             C66,3 84,5 98,14
             C84,11 68,11 54,15
             C32,21 16,38 0,33 Z"/>
  </g>
</svg>

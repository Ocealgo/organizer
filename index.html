<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- No maximum-scale: pinch-zoom is an accessibility affordance, not a bug.
         viewport-fit=cover lets the safe-area insets below do their job on
         notched phones. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d3d2e" />
    <meta name="description" content="Ocealgo Team Dashboard" />

    <!-- iOS reads none of the web manifest for the home-screen install: the
         icon, the name and whether it opens without Safari's chrome all come
         from these instead. Android takes them from the manifest and ignores
         these, so both are needed and neither is redundant. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ocealgo" />
    <!-- `black-translucent` puts the page under the status bar, which is what
         the safe-area padding below is already written for. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>Ocealgo — Team App</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #060a0f; font-family: 'Trebuchet MS', sans-serif; color: #fff;
        -webkit-tap-highlight-color: transparent; overflow-x: hidden;
        /* A shop name, an email or a pasted note must never push the layout
           wider than the screen. */
        overflow-wrap: break-word;
      }
      ::-webkit-scrollbar { display: none; }
      button { font-family: inherit; cursor: pointer; }
      textarea, input { font-family: inherit; }
      img, svg, video { max-width: 100%; height: auto; }

      /* ── The one content column ────────────────────────────────────────────
         Every screen is written phone-first with its own 20px inner padding.
         This centres that column and stops it stretching across a desktop
         monitor, which is the whole of the wide-screen story: one place to
         change, no per-screen media queries. */
      :root { --oc-page-max: 1120px; }
      .oc-page { width: 100%; max-width: var(--oc-page-max); margin-left: auto; margin-right: auto; }

      /* Anything that genuinely cannot shrink — a cross-tab, a wide chip strip —
         scrolls inside itself rather than widening the page. */
      .oc-scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; max-width: 100%; }

      /* A row of controls that should stack rather than squeeze on a phone. */
      .oc-wrap { display: flex; flex-wrap: wrap; }

      /* Safe areas — the Android/iOS shell draws under the status bar with
         viewport-fit=cover. */
      .oc-safe-top { padding-top: env(safe-area-inset-top, 0px); }
      body { padding-bottom: env(safe-area-inset-bottom, 0px); }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      .fade-in { animation: fadeIn 0.25s ease forwards; }

      /* Interactive states — inline styles cannot express pseudo-classes.
         Colours come from CSS variables set by ThemeProvider. */
      :focus-visible { outline: 2px solid var(--oc-accent); outline-offset: 2px; border-radius: 4px; }
      .oc-row, .oc-action { transition: background-color .12s ease, color .12s ease; }
      .oc-row:hover { background: var(--oc-hover) !important; }
      .oc-action:hover { color: var(--oc-text) !important; }

      .oc-modules { display: grid; grid-template-columns: 1fr 1fr; }
      .oc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      @media (max-width: 560px) {
        .oc-modules, .oc-stats { grid-template-columns: 1fr; }
      }

      /* iOS Safari zooms the page whenever a focused control is under 16px, and
         the design uses 14px throughout. `-webkit-touch-callout` is the usual
         iOS-only probe, so Android and desktop keep the intended size and only
         the browser with the bug pays for it. */
      @supports (-webkit-touch-callout: none) {
        @media (max-width: 599px) {
          input, textarea, select { font-size: 16px !important; }
        }
      }

      /* A list sitting directly under a tab strip: the strip already draws the
         opening rule, so the first row must not draw its own. */
      .oc-list-flush > :first-child { border-top: none !important; }

      /* A panel hanging off a header button.
         Anchored to the button on a wide screen, which is right there. On a
         phone the bell is not at the edge of the screen — there is a Menu to
         its right — so a 320px panel anchored to it runs off the left side and
         gets clipped by the body's overflow-x, cutting the message in half.
         Below the header breakpoint it anchors to the viewport instead.
         Positioning lives here rather than inline because an inline style
         cannot be overridden by a media query. */
      .oc-popover {
        position: absolute;
        top: calc(100% + 12px);
        right: 0;
        width: min(320px, calc(100vw - 40px));
      }
      @media (max-width: 599px) {
        .oc-popover {
          position: fixed;
          top: calc(env(safe-area-inset-top, 0px) + 58px);
          left: 12px;
          right: 12px;
          width: auto;
          /* And never taller than the screen it is sitting on. */
          max-height: calc(100dvh - env(safe-area-inset-top, 0px) - 80px);
          display: flex;
          flex-direction: column;
        }
      }

      /* Header responsive switch — the nav never wraps or overflows. */
      .oc-sm-only { display: none; }
      @media (max-width: 599px) {
        .oc-md-up { display: none !important; }
        .oc-sm-only { display: block; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition: none !important; animation: none !important; }
      }

      /* Printing a report. Ctrl+P -> Save as PDF gives a clean document without
         pulling in a PDF library: controls drop out, dark mode is forced to
         paper, and tables are allowed to break across pages sensibly. */
      @media print {
        .oc-no-print { display: none !important; }
        body {
          background: #fff !important;
          color: #000 !important;
        }
        .oc-print-plain, .oc-print-plain * {
          background: transparent !important;
          color: #000 !important;
          border-color: #999 !important;
        }
        a[href]::after { content: ""; }
        table { page-break-inside: auto; }
        tr { page-break-inside: avoid; page-break-after: auto; }
        thead { display: table-header-group; }
        @page { margin: 14mm; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
